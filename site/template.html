<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OW 勝率 韓国×アジア</title>
<style>
/* themes: 白 / 黒 / 薄緑 / 深緑 / 空色 */
:root,[data-theme="dgreen"]{
  --grid:rgba(255,255,255,.20); --grid-strong:rgba(255,255,255,.36);
  color-scheme: dark;
  --bg:#0d2b1c; --surface:#123624; --surface-2:#1a432e; --line:#285a40;
  --text:#f0f3ef; --text-2:#c4d2c8; --muted:#8fa596;
  --kr:#3987e5; --as:#d95926; --am:#199e70; --eu:#c98500;
  --pos:#3987e5; --neg:#e66767; --mid:#3a4a40; --accent:#3987e5;
  --tc-as:color-mix(in srgb, #d95926 24%, #141a17); --tc-kr:color-mix(in srgb, #3987e5 24%, #141a17);
}
[data-theme="black"]{
  --grid:rgba(255,255,255,.18); --grid-strong:rgba(255,255,255,.34);
  color-scheme: dark;
  --bg:#000000; --surface:#121211; --surface-2:#1e1e1c; --line:#2c2c29;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --kr:#3987e5; --as:#d95926; --pos:#3987e5; --neg:#e66767; --mid:#383835; --accent:#3987e5;
  --tc-as:color-mix(in srgb, #d95926 18%, #121211); --tc-kr:color-mix(in srgb, #3987e5 18%, #121211);
}
[data-theme="white"]{
  --grid:rgba(0,0,0,.16); --grid-strong:rgba(0,0,0,.30);
  color-scheme: light;
  --bg:#f6f6f4; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --kr:#2a78d6; --as:#eb6834; --pos:#2a78d6; --neg:#e34948; --mid:#f0efec; --accent:#2a78d6;
  --tc-as:color-mix(in srgb, #eb6834 10%, #fcfcfb); --tc-kr:color-mix(in srgb, #2a78d6 10%, #fcfcfb);
}
[data-theme="lgreen"]{
  --grid:rgba(0,40,10,.18); --grid-strong:rgba(0,40,10,.32);
  color-scheme: light;
  --bg:#e3f2e6; --surface:#f4faf5; --surface-2:#e6f1e8; --line:#c8dfcd;
  --text:#0d1f12; --text-2:#3f5546; --muted:#76907d;
  --kr:#2a78d6; --as:#eb6834; --pos:#2a78d6; --neg:#e34948; --mid:#eef2ee; --accent:#2a78d6;
  --tc-as:color-mix(in srgb, #eb6834 12%, #fbfbf8); --tc-kr:color-mix(in srgb, #2a78d6 12%, #fbfbf8);
}
[data-theme="sky"]{
  --grid:rgba(0,25,50,.18); --grid-strong:rgba(0,25,50,.32);
  color-scheme: light;
  --bg:#dceefb; --surface:#f3f9fe; --surface-2:#e3f0fa; --line:#c3dbef;
  --text:#0b1a2b; --text-2:#3d5368; --muted:#7690a8;
  --kr:#2a78d6; --as:#eb6834; --pos:#2a78d6; --neg:#e34948; --mid:#eef1f4; --accent:#2a78d6;
  --tc-as:color-mix(in srgb, #eb6834 12%, #fbfbfa); --tc-kr:color-mix(in srgb, #2a78d6 12%, #fbfbfa);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{padding:18px 20px 6px;max-width:1440px;margin:0 auto;position:relative}
.themebar{position:absolute;right:20px;top:16px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.themebar select{min-height:30px;padding:4px 8px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--text-2);font-size:12.5px}
.sub a{color:var(--text-2)}
main{max-width:1440px;margin:0 auto;padding:0 20px 40px}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;border-bottom:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:11px;color:var(--muted)}
select,input[type=search]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);min-height:34px}
select:disabled{opacity:.5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--text-2);padding:6px 12px;cursor:pointer;min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--text);font-weight:600}
.chk{display:flex;gap:10px;align-items:center;min-height:34px;font-size:13px;color:var(--text-2)}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer;font-size:13px;color:var(--text-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.note{font-size:12px;color:var(--text-2);margin:10px 0 8px;display:flex;gap:16px;flex-wrap:wrap}
.note b{color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 150px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;user-select:none;vertical-align:bottom}
th.sorted{color:var(--text)}
th .arr{font-size:10px;margin-left:2px}
td.hero,th.hero{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th.hero{z-index:3}
td.hero{font-weight:600}
.role{display:inline-block;font-size:10.5px;font-weight:500;color:var(--text-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;margin-right:9px;vertical-align:middle;background:var(--surface-2);border:2px solid var(--line);flex:none}
.hn{display:inline-flex;align-items:center}
.mx .av{width:22px;height:22px;margin-right:7px;border-width:1.5px}
#tip .t{display:flex;align-items:center;gap:8px}
#tip .t .av{width:32px;height:32px;margin:0}
tbody tr:hover td{background:var(--surface-2)}
.wr{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.bar{position:relative;width:64px;height:8px;background:var(--surface-2);border-radius:4px;flex:none}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.pb{position:relative;width:64px;height:8px;background:var(--surface-2);border-radius:4px;flex:none}
.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.na{color:var(--muted)}
.diff.p{color:var(--pos);font-weight:600}.diff.n{color:var(--neg);font-weight:600}
.colhead{display:inline-flex;align-items:center;gap:5px}
.rank{color:var(--muted);font-size:11px;font-weight:400;margin-right:6px;display:inline-block;width:18px;text-align:right}
/* matrix */
.mx td,.mx th{padding:0;border-bottom:1px solid var(--surface)}
.mx thead tr:first-child th{top:0;height:22px}
.mx thead tr:nth-child(2) th{top:22px;height:168px;vertical-align:bottom;padding:4px 0;border-bottom:1px solid var(--line)}
.mx thead th .vt{writing-mode:vertical-rl;font-size:11.5px;font-weight:500;color:var(--text-2);display:inline-block;max-height:160px;overflow:hidden;text-overflow:ellipsis}
.mx thead th.tp{font-size:11px;color:var(--muted);font-weight:500;text-align:center;border-bottom:0;padding:4px 0 0}
.mx td.c{min-width:38px;height:26px;text-align:center;font-size:11px;cursor:default;border-right:2px solid var(--surface)}
.mx td.hero{padding:0 10px;height:26px}
.mx td.allc{font-weight:600}
.mx th.sep,.mx td.sep{border-left:3px solid var(--surface)}
.mx td.rg{position:sticky;left:var(--hw,150px);z-index:1;background:var(--surface);font-size:11px;color:var(--text-2);padding:0 8px 0 4px;white-space:nowrap;text-align:left}
.mx th.rg{position:sticky;left:var(--hw,150px);z-index:3;background:var(--surface)}
.mx tr.r2 td{border-bottom:3px solid var(--surface)}
.mx tr.r1 td.hero{border-bottom:3px solid var(--surface)}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin:10px 0 8px;flex-wrap:wrap}
.ramp{display:flex;height:10px;border-radius:5px;overflow:hidden;width:180px}
.ramp span{flex:1}
.rk{max-width:640px}
.mapnav{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.mapnav button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
.mapnav b{font-size:17px;margin:0 6px}
.mapnav small{color:var(--muted)}
.mapnav button:disabled{opacity:.4;cursor:default}
.rgrid,.tgrid2{align-items:start}
.note .past{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.rk .card{max-height:none;overflow:visible}
.rk h3{margin:0;padding:10px 12px 6px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rk h3 small{font-size:11px;font-weight:400;color:var(--muted)}
.rk table td,.rk table th{padding:4px 8px}
.rk thead th{position:static;cursor:default;font-size:11px}
.rk td.v{width:58px;text-align:center;font-size:12.5px;border-radius:4px;border-bottom:2px solid var(--surface)}
.rk td.hero{position:static;font-weight:600;font-size:13px}
.rk .av{width:24px;height:24px;margin-right:7px}
.rk .rank{width:16px}
.rk .card.all{grid-column:1/-1}
.rk .card.all table{columns:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,640px),1fr));gap:14px}
.tgrid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tgrid2 .tv td.w{width:auto;min-width:40px;padding:4px 3px;font-size:12px}
.tgrid2 .tv td.sm{width:auto;padding:4px 3px;font-size:11px}
.tgrid2 .tv th{padding:3px 3px;font-size:10.5px}
.tgrid2 .tv td.hero{font-size:12px;padding:4px 3px;white-space:nowrap}
.tgrid2 .av{width:22px;height:22px;margin-right:4px}
.tgrid2 .badge{font-size:9px;padding:0 4px;margin:1px 0 0}
.tgrid2 .nm{line-height:1.25}
.tgrid2 .rank{width:14px;margin-right:3px}
.tc-Asia{--cardbg:var(--tc-as)}
.tc-Korea{--cardbg:var(--tc-kr)}
.tc-Avg{--cardbg:var(--surface)}
.tc-Avg .tth .sw{background:linear-gradient(90deg,var(--as) 50%,var(--kr) 50%)!important}
.tcard{background:var(--cardbg);border-color:color-mix(in srgb, var(--cardbg) 70%, var(--line))}
.tcard thead th,.tcard td.hero{background:var(--cardbg)}
.tcard .tth{background:var(--cardbg)}
.tcard tbody tr:hover td.hero,.tcard tbody tr:hover td.sm{background:color-mix(in srgb, var(--cardbg) 93%, var(--text))}
.tcard td,.tcard th{border-bottom:1px solid var(--grid)}
.tcard{border:1px solid var(--grid-strong)}
.tcard thead tr:last-child th{border-bottom:1px solid var(--grid-strong)}
.tcard td.w{border-bottom:1px solid var(--grid)}
.tcard .tv td,.tcard .tv th{border-left:1px solid var(--grid)}
.tcard .tv td.hero,.tcard .tv th.hero{border-left:0}
.tcard .tv thead tr.g th:not(.gs){border-left:0}
.tcard .tv th.gs,.tcard .tv td.gs{border-left:2px solid var(--grid-strong)}
.tcard.minonly{max-width:460px}
.tv th.sortable{cursor:pointer;color:var(--text);text-decoration:underline dotted;text-underline-offset:3px}
.tv th.sortable:hover{background:color-mix(in srgb, var(--cardbg) 85%, var(--text))}
.tv th.sorted{text-decoration:none}
.tv th .arr{color:var(--pos);margin-left:2px}
.tgrid2.mins{grid-template-columns:repeat(2,minmax(0,460px))}
.tgrid2.mins.one{grid-template-columns:minmax(0,460px)}
.tgrid2.one{grid-template-columns:minmax(0,1fr);max-width:900px}
.rgrid.one{grid-template-columns:minmax(0,1fr);max-width:520px}
.rgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));max-width:1000px}
.rgrid .tv thead tr.c th{top:0 !important}
.tcard{max-height:calc(100vh - 120px)}
.tth{margin:0;padding:10px 12px;font-size:16px;display:flex;align-items:center;gap:6px;position:sticky;left:0}
.tth small{font-size:11px;font-weight:400;color:var(--muted)}
.tv thead tr.g th{top:0 !important}
.tv thead tr.c th{top:22px !important}
.tv thead tr.r0 th{top:0;text-align:center;font-size:13px;color:var(--text);cursor:default;border-bottom:0;padding:6px 4px 2px}
.tv thead tr.g th{top:28px;text-align:center;color:var(--text-2);font-size:12px;border-bottom:0;padding:2px 4px 0;cursor:default}
.tv thead tr.c th{top:50px;font-size:11px;padding:4px 6px}
.tv th.reg{border-left:6px solid var(--surface-2)}
.tv td.w,.tv td.sm{padding:4px 5px}
.tv td.sm{width:44px}
.tv .bdg{margin-top:2px;padding-left:24px}
.tv .bdg .badge{margin-left:0;margin-right:4px}
.tv td.w{text-align:center;font-weight:600;width:58px;border-radius:4px;border-bottom:2px solid var(--surface)}
.tv td.sm{color:var(--text-2);font-size:12px;width:52px}
.tv th.gs,.tv td.gs{border-left:3px solid var(--surface-2)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--pos);color:#fff}
.badge.n{background:transparent;color:var(--neg);border:1px solid var(--neg)}
#tip{position:fixed;pointer-events:none;z-index:20;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.6);display:none;min-width:170px}
#tip .t{font-weight:600;margin-bottom:4px}
#tip .r{display:flex;justify-content:space-between;gap:14px}
#tip .r span:first-child{display:flex;align-items:center;gap:5px;color:var(--text-2)}
.ftoggle{display:none}
.chk label:has(input:disabled){opacity:.4;cursor:not-allowed}
.swipe{display:none}
@media (max-width:700px){
  body{font-size:13px}
  header{padding:12px 12px 4px}
  .themebar{position:static;justify-content:flex-end;margin-bottom:4px}
  h1{font-size:17px;line-height:1.35}
  .sub{font-size:11.5px}
  main{padding:0 10px 30px}
  .ftoggle{grid-column:1/-1;display:flex;align-items:center;gap:8px;width:100%;margin:0;font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left}
  .ftoggle .ft-l{font-weight:700;flex:none}
  .ftoggle .ft-s{flex:1;color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ftoggle .ft-a{flex:none;color:var(--muted);transition:transform .15s}
  .ftoggle[aria-expanded=true] .ft-a{transform:rotate(180deg)}
  .filters{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:10px 0 12px;align-items:end}
  .filters.closed>.f:not(:first-child){display:none}
  .filters.closed{padding-bottom:8px}
  .f{min-width:0}
  .f select,.f input[type=search]{width:100%;min-width:0;min-height:38px;font-size:14px}
  .f:first-child,#tRankWrap,#tStableWrap,#tSortWrap,#roleWrap{grid-column:1/-1}
  .seg{display:flex}.seg button{flex:1;min-height:38px}
  .chk{flex-wrap:wrap;gap:6px 12px;min-height:0}
  .chk label{white-space:nowrap;font-size:13px;min-height:30px}
  #tRanks label{flex:0 0 auto}
  .note{gap:4px 12px;font-size:11.5px}
  .legend{font-size:11.5px;gap:6px}
  .legend .ramp{width:120px}
  .mapnav{gap:6px}
  .mapnav button{padding:6px 14px;min-height:40px;min-width:44px;flex:none}
  .mapnav .lbl{display:none}
  .mapnav b{font-size:16px;margin:0 2px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mapnav small{display:none}
  .rgrid,.tgrid2{grid-template-columns:minmax(0,1fr)!important;max-width:none;gap:12px}
  .card{max-height:none}
  .rgrid .tcard{max-height:none;overflow:visible}
  .rgrid .tv thead th{position:static}
  .rgrid .role{display:none}
  .rgrid .av{width:26px;height:26px;margin-right:7px}
  .rgrid .tv td.hero{font-size:13px;padding:4px 6px}
  .rgrid .rank{width:16px;margin-right:4px}
  .rgrid .tv td.w{width:54px;font-size:13px}
  .rgrid .tv td.sm{width:46px;font-size:12px;padding:4px 6px}
  .tgrid2 .tcard{max-height:78vh}
  .tgrid2 .nm{display:inline-block;max-width:6.2em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .swipe{display:inline}
  .tth{font-size:15px;padding:8px 10px}
  .rk{max-width:none}
}
footer{max-width:1440px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:11.5px}
.empty{padding:30px;text-align:center;color:var(--text-2)}
@media (max-width:700px){header,main,footer{padding-left:10px;padding-right:10px}.bar,.pb{width:40px}th,td{padding:5px 6px}}
</style>
</head>
<body>
<header>
  <div class="themebar"><label for="theme">背景</label><select id="theme"><option value="white">白</option><option value="black">黒</option><option value="lgreen">薄緑</option><option value="dgreen">深緑</option><option value="sky">空色</option></select></div>
  <h1>オーバーウォッチ 勝率 — 韓国 × アジア</h1>
  <div class="sub" id="asof"></div>
</header>
<main>
  <div class="filters" id="filters" role="group" aria-label="絞り込み">
  <button id="fToggle" class="ftoggle" aria-expanded="false" aria-controls="filters"><span class="ft-l">条件</span><span id="fSum" class="ft-s"></span><span class="ft-a">▼</span></button>
    <div class="f"><label for="period">シーズン</label>
      <select id="period"></select></div>
    <div class="f"><label for="regShow">表示する地域</label>
      <select id="regShow"><option value="both">アジア＋韓国（両方）</option><option value="Asia">アジアのみ</option><option value="Korea">韓国のみ</option></select></div>
    <div class="f"><label for="mode">モード</label>
      <select id="mode"><option value="2">ライバル・プレイ（競技）</option><option value="0">クイック・プレイ</option></select></div>
    <div class="f"><label for="input">入力</label>
      <select id="input"><option value="PC">PC（マウス＆キーボード）</option><option value="Console">コンソール（コントローラー）</option></select></div>
    <div class="f" id="mapWrap"><label for="map">マップ</label><select id="map"></select></div>
    <div class="f" id="tRankWrap" style="flex-basis:100%"><label>比べるランク帯（2〜4個がおすすめ）</label>
      <div class="chk" id="tRanks"></div>
      </div>
    <div class="f" id="colsWrap"><label for="cols">表示する列</label>
      <select id="cols"><option value="each">ランク帯ごと（勝率・ピック）</option><option value="avg">選んだ帯の平均だけ</option><option value="min">最低勝率だけ</option></select></div>
    <div class="f" id="roleWrap"><label>ロール（未選択＝すべて）</label>
      <div class="chk" id="roles"><label><input type="checkbox" value="tank">タンク</label><label><input type="checkbox" value="damage">ダメージ</label><label><input type="checkbox" value="support">サポート</label></div></div>
    <div class="f"><label for="q">ヒーロー検索</label><input id="q" type="search" placeholder="例: アナ" size="10"></div>
    <div class="f" id="tStableWrap"><label>絞り込み</label>
      <div class="chk"><label><input type="checkbox" id="stableOnly">「安定」（最低勝率50%以上）のヒーローだけ</label><label><input type="checkbox" id="bothStable">アジアと韓国の両方で「安定」のヒーローだけ</label><label><input type="checkbox" id="onlyStable">アジアと韓国の平均で1つの表にする</label></div></div>
  </div>
  <div class="note" id="note"></div>
  <div id="out"></div>
</main>
<footer>
  出典: 韓国 = <a href="https://overwatch.nexon.com/hero/rate" style="color:inherit">Nexon 公式 영웅 통계</a>（韓国PCサーバーのみ・コンソールなし）／アジア・米州・欧州 = <a href="https://overwatch.blizzard.com/ja-jp/rates/" style="color:inherit">Blizzard 公式ヒーロー統計</a>。
  数値は各公式ページが表示している「最新パッチ開始からの集計」をそのまま写したものです。勝率はミラー戦（同じヒーロー同士）を除いた値。データは毎日1回（12時ごろ）自動で更新されます。過去シーズンは owherostats.com の集計と、シーズン切り替わり時に保存した公式の数字です。
</footer>
<div id="tip" role="tooltip"></div>
<script>
(function(){ let t = "dgreen"; try{ t = localStorage.getItem("owwr-theme") || t; }catch(e){} document.documentElement.dataset.theme = t; })();
const D = /*__DATA__*/null;
const REG = {Avg:{ja:"アジアと韓国の平均",c:"--text-2"},Korea:{ja:"韓国",c:"--kr"},Asia:{ja:"アジア",c:"--as"},Americas:{ja:"米州",c:"--am"},Europe:{ja:"欧州",c:"--eu"}};
const TIERS = [["All","全ランク"],["Bronze","ブロンズ"],["Silver","シルバー"],["Gold","ゴールド"],["Platinum","プラチナ"],["Emerald","エメラルド"],["Diamond","ダイヤモンド"],["Master","マスター"],["Grandmaster","グランドマスター＆チャンピオン"]];
const ROLE_JA = {tank:"タンク",damage:"ダメージ",support:"サポート"};
const MET = ["勝率","ピック率","BAN率"];
const $ = s => document.querySelector(s);
const st = {view:"rank"};
try{ Object.assign(st, JSON.parse(localStorage.getItem("owwr-v4")||"{}")); }catch(e){}

// ---- controls
{
  let html = "", last = null;
  for (const m of D.maps){
    if (m.type !== last){ if (last !== null) html += "</optgroup>"; if (m.type) html += `<optgroup label="${D.mapTypes[m.type]}">`; last = m.type; }
    html += `<option value="${m.id}">${m.ja}</option>`;
  }
  $("#map").innerHTML = html + "</optgroup>";
}
// ---- シーズン（期間）
const P = D.periods || {periods:[], current:null};
const md = d => { if (!d) return ""; const [y,m,dd] = d.split("-").map(Number); return (y !== new Date().getFullYear() ? y+"/" : "") + m + "/" + dd; };
const range = p => { const f = (d, y) => { const [Y,M,DD] = d.split("-").map(Number); return (y ? Y+"/" : "") + M + "/" + DD; };
  if (!p.start) return ""; if (!p.end) return f(p.start, false) + "〜";
  const cross = p.start.slice(0,4) !== p.end.slice(0,4), old = +p.start.slice(0,4) !== new Date().getFullYear();
  return f(p.start, cross || old) + "〜" + f(p.end, cross); };
$("#period").innerHTML = `<option value="">最新${P.current ? `（${P.current.ja}・${md(P.current.start)}〜）` : "（今のシーズン）"}</option>` +
  (P.periods.length ? `<optgroup label="過去のシーズン">${P.periods.map(p=>`<option value="${p.id}">${p.ja}（${range(p)}）</option>`).join("")}</optgroup>` : "");
const PER = {};          // 読み込んだ過去シーズンのデータ
const period = () => $("#period").value;
const pinfo = () => P.periods.find(p=>p.id===period());
const src = () => period() ? PER[period()] : D.combos;
const curMap = () => period() ? "all-maps" : $("#map").value;
function loadPeriod(id){
  if (PER[id] || loadPeriod.busy === id) return;
  loadPeriod.busy = id;
  fetch(`data/periods/${id}.json`).then(r=>{ if(!r.ok) throw r.status; return r.json(); })
    .then(j=>{ PER[id] = j; }).catch(()=>{ PER[id] = {}; }).finally(()=>{ loadPeriod.busy = null; render(); });
}
if (st.rankAvg && !st.cols) st.cols = "avg";
if (!["min","avg"].includes(st.sortKey)) st.sortKey = st.tSort === "avg" ? "avg" : "min";
if (!Array.isArray(st.roles)) st.roles = st.role ? [st.role] : [];
const ctl = ["period","regShow","mode","input","map","cols"];
for (const k of ctl){ if (st[k] != null && [...$("#"+k).options].some(o=>o.value===st[k])) $("#"+k).value = st[k]; }
for (const k of ctl) $("#"+k).addEventListener("change", render);
// rank checkboxes for the ランク帯比較 view (default: Gold / Platinum / Emerald)
$("#tRanks").innerHTML = TIERS.filter(t=>t[0]!=="All").map(([v,j])=>`<label><input type="checkbox" value="${v}">${j}</label>`).join("");
{ const def = st.tRanks || ["Gold","Platinum","Emerald"];
  for (const c of document.querySelectorAll("#tRanks input")){ c.checked = def.includes(c.value); c.addEventListener("change", ()=>{
      // 選んだ順に並べる（チェックした順に左から）
      const cur = (st.tRanks || ["Gold","Platinum","Emerald"]).filter(v=>v!==c.value);
      st.tRanks = c.checked ? [...cur, c.value] : cur; render(); }); } }
$("#q").addEventListener("input", render);
for (const c of document.querySelectorAll("#roles input")){ c.checked = st.roles.includes(c.value);
  c.addEventListener("change", ()=>{ st.roles = [...document.querySelectorAll("#roles input:checked")].map(x=>x.value); render(); }); }

function save(){
  const o = {roles:st.roles, sortKey:st.sortKey, tRanks:st.tRanks, onlyStable:$("#onlyStable").checked, stableOnly:$("#stableOnly").checked, bothStable:$("#bothStable").checked};
  for (const k of ctl) o[k] = $("#"+k).value;
  try{ localStorage.setItem("owwr-v4", JSON.stringify(o)); }catch(e){}
}

// ---- data access
function heroes(){
  const roles = st.roles || [], q = $("#q").value.trim().toLowerCase();
  return Object.entries(D.heroes).filter(([id,h])=>(q || !roles.length || roles.includes(h.role)) &&
    (!q || (h.ja||"").toLowerCase().includes(q) || (h.en||"").toLowerCase().includes(q) || (h.ko||"").includes(q) || id.includes(q)))
    .map(([id,h])=>({id,...h}));
}
const av = h => D.img[h.id] ? `<img class="av" src="${D.img[h.id]}" alt="" style="border-color:${h.color||"var(--line)"}">` : "";
const fmt = v => v==null ? "—" : v.toFixed(1)+"%";
const fmtD = v => v==null ? "—" : (v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1);

// diverging color for win-rate / diff, sequential for pick/ban
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function hex2rgb(h){ h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function mix(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b); return `rgb(${A.map((x,i)=>Math.round(x+(B[i]-x)*t)).join(",")})`; }
function divColor(v, center, span){
  if (v==null) return "transparent";
  const t = Math.max(-1, Math.min(1, (v-center)/span));
  return t>=0 ? mix(cssv("--mid"), cssv("--pos"), t) : mix(cssv("--mid"), cssv("--neg"), -t);
}
function seqColor(v, max){ if (v==null) return "transparent"; return mix(cssv("--mid"), cssv("--pos"), Math.min(1, v/max)); }
function inkFor(bg){ const m = bg.match(/\d+/g); if(!m) return ""; const [r,g,b]=m.map(Number); return (0.299*r+0.587*g+0.114*b) > 150 ? "#0b0b0b" : "#ffffff"; }

function shownRegs(){ const v = $("#regShow").value; return v === "both" ? ["Asia","Korea"] : [v]; }
function render(){
  $("#tRankWrap").hidden = $("#mode").value === "0";
  { const b = $("#bothStable").checked;   // 「両方で安定」中は、ほかの2つは選んでも結果が変わらないのでグレーアウト
    for (const id of ["onlyStable","stableOnly"]){ const c = $("#"+id); c.disabled = b; c.closest("label").title = b ? "「アジアと韓国の両方で安定」を選んでいる間は使えません（自動で含まれます）" : ""; } }
  $("#colsWrap").hidden = $("#mode").value === "0" || (st.tRanks || ["Gold","Platinum","Emerald"]).length < 2;
  const pid = period();
  $("#map").disabled = !!pid;
  save();
  if (pid && !PER[pid]){ loadPeriod(pid); $("#note").innerHTML = ""; $("#out").innerHTML = `<div class="card"><div class="empty">過去シーズンのデータを読み込み中…</div></div>`; return; }
  const notes = [];
  const tierJa = $("#mode").value === "0" ? "（クイックはランク区分なし）" : "";
  if (pid){ const p = pinfo();
    notes.push(`<span class="past">過去シーズン表示中: <b>${p.ja}</b>（${range(p)}）の最終的な数字</span>`);
    notes.push(`<span>過去シーズンは全マップ合計のみ。owherostats.com の集計を取り込んだもの</span>`);
    const anyC = Object.values(PER[pid]||{})[0], hasBan = anyC && anyC.m["all-maps"].some((x,i)=>i%3===2 && x!=null);
    if (!(p.regions||[]).includes("Korea")) notes.push(`<span>この期間は韓国のデータがありません（韓国は2026年9月のシーズン4後半から）</span>`);
  } else notes.push(`<span>データ取得: <b>${D.asof}</b></span>`);
  if ($("#input").value === "Console") notes.push(`<span>韓国（ネクソン）はPCのみ公開のため、コンソール選択時は韓国が「—」になります</span>`);
  $("#note").innerHTML = notes.join("");
  { const t = o => o.options[o.selectedIndex]?.text.replace(/（.*?）/g,"") || "";
    const parts = [t($("#period")), t($("#mode")), t($("#input")), pid?"":t($("#map")), $("#mode").value==="0"?"":(st.tRanks || ["Gold","Platinum","Emerald"]).map(r=>TIERS.find(x=>x[0]===r)?.[1].replace("＆チャンピオン","")).join("/")].filter(Boolean);
    if ((st.roles||[]).length) parts.push(st.roles.map(r=>ROLE_JA[r]).join("/"));
    $("#fSum").textContent = parts.join("・"); }
  renderTiers();
}

function tierTable(region, tier, map){
  const input = region === "Korea" ? "PC" : $("#input").value;
  if (region === "Korea" && $("#input").value === "Console") return null;
  const c = (src()||{})[`${region}_${$("#mode").value}_${input}_${tier}`]; if (!c) return null;
  const flat = c.m[map]; if (!flat) return null;
  const out = {}; c.h.forEach((h,i)=>{ const v = flat.slice(i*3,i*3+3).map(x=>x==null?null:x/10); if (v.some(x=>x!=null)) out[h]=v; });
  return out;
}
function renderTiers(){
  const map = curMap();
  const qp = $("#mode").value === "0";
  const ranks = qp ? [TIERS[0]] : (st.tRanks || ["Gold","Platinum","Emerald"]).map(v=>TIERS.find(t=>t[0]===v)).filter(Boolean);
  const rj = r => r[1].replace("＆チャンピオン","");
  const mapJa = D.maps.find(m=>m.id===map)?.ja;
  if (!ranks.length){ $("#out").innerHTML = `<div class="card"><div class="empty">比べるランク帯を1つ以上選んでください。</div></div>`; return; }
  const colMode = ranks.length > 1 ? $("#cols").value : "each";
  const ravg = colMode === "avg", rmin = colMode === "min";
  const multi = ranks.length > 1;
  const bOnly = $("#bothStable").checked;
  const sOnly = $("#stableOnly").checked || bOnly;
  const fixed = rmin || !multi || sOnly;   // 並び替えできない（並び順固定）
  const sortBy = rmin || !multi ? "min" : sOnly ? "avg" : st.sortKey;
  const sth = (k, label, cls="gs") => !fixed ? `<th class="${cls} sortable${sortBy===k?" sorted":""}" data-sort="${k}" title="クリックで並び替え">${label}${sortBy===k?'<span class="arr">▼</span>':""}</th>` : `<th class="${cls}">${label}</th>`;
  const cell = (v, cls="") => { const bg = divColor(v,50,8); return `<td class="w ${cls}" style="background:${bg};color:${v==null?"var(--muted)":inkFor(bg)}">${v==null?"—":v.toFixed(1)}</td>`; };
  const sm = v => `<td class="sm">${v==null?"—":v.toFixed(1)}</td>`;
  const stableIn = reg => { const T = ranks.map(([t])=>tierTable(reg, t, map)); const set = new Set();
    for (const h of heroes()){ const wr = T.map(tb=>tb?.[h.id]?.[0]).filter(x=>x!=null); if (wr.length===ranks.length && wr.every(x=>x>=50)) set.add(h.id); }
    return set; };
  const only = $("#onlyStable").checked || bOnly;   // 「両方で安定」のときも1つの表にまとめる
  const bothSet = bOnly ? (()=>{ const a = stableIn("Asia"), k = stableIn("Korea"); return new Set([...a].filter(x=>k.has(x))); })() : null;
  // 平均表：アジアと韓国の数字を帯ごとに平均（片方しかない値はそのまま）
  const avgTable = t => { const a = tierTable("Asia", t, map), k = tierTable("Korea", t, map); if (!a && !k) return null;
    const out = {}; for (const id of new Set([...Object.keys(a||{}), ...Object.keys(k||{})])){
      out[id] = [0,1,2].map(i=>{ const xs = [a?.[id]?.[i], k?.[id]?.[i]].filter(x=>x!=null); return xs.length ? xs.reduce((p,q)=>p+q,0)/xs.length : null; }); }
    return out; };
  const oneTable = reg => {
    const T = ranks.map(([t])=> reg === "Avg" ? avgTable(t) : tierTable(reg, t, map));
    let rows = heroes().map(h=>{
      const v = T.map(tb=>tb?.[h.id] || [null,null,null]);
      const wr = v.map(x=>x[0]).filter(x=>x!=null), full = wr.length===ranks.length;
      return {h, v, min: full ? Math.min(...wr) : null, avg: wr.length ? wr.reduce((a,b)=>a+b,0)/wr.length : null,
              up: full && wr.every(x=>x>=50), down: full && wr.every(x=>x<50)};
    }).filter(o=>o.v.some(x=>x[0]!=null) && (!bothSet || bothSet.has(o.h.id)) && (!sOnly || (o.min!=null && o.min>=50)));
    const mean = xs => { xs = xs.filter(x=>x!=null); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
    if (ravg) rows.forEach(o=>{ o.v = [[0,1,2].map(i=>mean(o.v.map(x=>x[i])))]; });
    const key = o => sortBy==="avg" ? o.avg : o.min;
    rows.sort((a,b)=>{ const x=key(a), y=key(b); if (x==null&&y==null) return 0; if (x==null) return 1; if (y==null) return -1; return y-x; });
    let h = `<div class="card tcard tc-${reg}${rmin?" minonly":""}"><h3 class="tth"><span class="sw" style="background:var(${REG[reg].c})"></span> ${REG[reg].ja}${reg==="Korea"&&$("#input").value==="Console"?" <small>（韓国はPCのみ公開のためデータなし）</small>":""}</h3><table class="tv"><thead>`;
    h += `<tr class="g"><th class="hero"></th>${(rmin ? [] : ravg ? [[null,"平均（"+ranks.map(rj).join("・")+"）"]] : ranks).map(r=>`<th colspan="2" class="gs">${rj(r)}</th>`).join("")}<th class="gs" colspan="${multi && !ravg && !rmin ? 2 : 1}">まとめ</th></tr>`;
    h += `<tr class="c"><th class="hero">ヒーロー</th>${rmin ? "" : ravg ? sth("avg","平均勝率")+"<th>ピック</th>" : ranks.map(()=>`<th class="gs">勝率</th><th>ピック</th>`).join("")}${multi && !ravg && !rmin ? sth("avg","平均勝率") : ""}${sth("min","最低勝率")}</tr></thead><tbody>`;
    rows.forEach((o,i)=>{
      const badge = o.up ? `<span class="badge">安定</span>` : o.down ? `<span class="badge n">苦戦</span>` : "";
      h += `<tr><td class="hero"><span class="hn"><span class="rank">${i+1}</span>${av(o.h)}<span class="nm">${o.h.ja||o.h.en}${badge?`<br>${badge}`:""}</span></span></td>`;
      if (!rmin) o.v.forEach(x=>{ h += cell(x[0],"gs") + sm(x[1]); });
      if (multi && !ravg && !rmin) h += cell(o.avg,"gs");
      h += cell(o.min,"gs") + `</tr>`;
    });
    if (!rows.length) h += `<tr><td colspan="${(rmin?0:ravg?1:ranks.length)*2+2+(multi && !ravg && !rmin ? 1 : 0)}" class="empty">${period() && !(pinfo().regions||[]).includes(reg) ? `この期間は${REG[reg].ja}のデータがありません` : bOnly ? "アジアと韓国の両方で「安定」のヒーローはいません（ランク帯やロールを変えてみてください）" : sOnly ? "この条件で「安定」のヒーローはいません（ランク帯やロールを変えてみてください）" : "この条件のデータはありません"}</td></tr>`;
    return h + `</tbody></table></div>`;
  };
  let html = `<div class="legend"><b>${mapJa}・${ranks.map(rj).join(" / ")}</b><span><span class="badge">安定</span>＝選んだ帯すべてで勝率50%以上　<span class="badge n">苦戦</span>＝すべてで50%未満</span><span class="ramp">${[42,45,48,50,52,55,58].map(v=>`<span style="background:${divColor(v,50,8)}"></span>`).join("")}</span><span>勝率 42% → 58%</span>${only?"":"<span>各表はその地域の数字で並べ替えています</span>"}${qp?"<span>クイック・プレイはランク区分がないため全ランクのみ</span>":""}${multi && !rmin?`<span><b>${sortBy==="avg"?"平均勝率":"最低勝率"}が高い順</b>${sOnly?"（「安定」で絞り込み中は平均勝率順で固定）":"（「平均勝率」「最低勝率」の列名をクリックで並び替え）"}</span>`:""}${rmin?"<span><b>最低勝率だけを表示中</b>（選んだ帯の中で一番低い勝率。高い順）</span>":""}${bOnly?`<span><b>アジアと韓国の両方で安定：${bothSet.size}人</b></span>`:""}<span class="swipe">← 表は横にスクロールできます →</span>${only?`<span><b>数字はアジアと韓国の平均</b>（「安定」「苦戦」も平均の勝率で判定）</span>`:""}</div>`;
  const rs = only ? ["Avg"] : shownRegs();
  html += `<div class="tgrid tgrid2 ${rs.length===1?"one":""} ${rmin?"mins":""}">${rs.map(oneTable).join("")}</div>`;
  $("#out").innerHTML = html;
  $("#out").onmousemove = null; $("#tip").style.display = "none";
}

function showTip(e, title, rows){
  const tip = $("#tip");
  let s = `<div class="t">${title}</div>`;
  s += `<div class="r" style="color:var(--muted);font-size:11px"><span></span><span>勝率 / ピック</span></div>`;
  for (const [r,v] of rows){
    s += `<div class="r"><span><span class="sw" style="background:var(${REG[r].c})"></span>${REG[r].ja}</span><span>${v? v.map(x=>x==null?"—":x.toFixed(1)).join(" / ") : "—"}</span></div>`;
  }
  tip.innerHTML = s; tip.style.display = "block";
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + hgt > innerHeight - 8) y = e.clientY - hgt - 14;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}

{ const mq = matchMedia("(max-width:700px)");
  const setOpen = o => { $("#filters").classList.toggle("closed", !o); $("#fToggle").setAttribute("aria-expanded", o); };
  setOpen(!mq.matches);
  $("#fToggle").addEventListener("click", ()=>setOpen($("#filters").classList.contains("closed")));
  mq.addEventListener("change", e=>setOpen(!e.matches)); }
$("#out").addEventListener("click", e=>{ const th = e.target.closest("th[data-sort]"); if (!th) return; st.sortKey = th.dataset.sort; render(); });
$("#bothStable").checked = !!st.bothStable;
$("#bothStable").addEventListener("change", render);
$("#stableOnly").checked = !!st.stableOnly;
$("#stableOnly").addEventListener("change", render);
$("#onlyStable").checked = !!st.onlyStable;
$("#onlyStable").addEventListener("change", render);
$("#theme").value = document.documentElement.dataset.theme;
$("#theme").addEventListener("change", e=>{ document.documentElement.dataset.theme = e.target.value; try{ localStorage.setItem("owwr-theme", e.target.value); }catch(_){} render(); });
$("#asof").innerHTML = `韓国（ネクソン公式）とアジア（Blizzard公式）の全ヒーローの勝率・ピック率を並べて表示。マップ・ランク・モード別。`;
render();
</script>
</body>
</html>
